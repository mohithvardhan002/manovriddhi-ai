services:
  - type: web
    name: manovriddhi-backend
    env: python
    buildCommand: pip install -r requirements.txt && python seed_data.py
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: MIN_SCORE
        value: "0.5"
